name: windows-build
# Builds BF6KillTracker.exe (folder + zip) on every push to main; on a "v*" tag it
# also publishes a GitHub release with the zip attached (used by the in-app update check).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name BF6KillTracker --paths .
          --collect-submodules bf6killtracker --add-data "bf6killtracker/templates;bf6killtracker/templates"
          --collect-binaries imageio_ffmpeg
          --exclude-module pytest packaging/app.py
      - name: Smoke test the exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = "dist/BF6KillTracker/BF6KillTracker.exe"
          python -c "import imageio_ffmpeg,subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-v','error','-f','lavfi','-i','testsrc=size=1280x720:rate=30','-t','2','-pix_fmt','yuv420p','smoke.mp4'],check=True)"
          $p = Start-Process $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput ver.txt -RedirectStandardError err.txt
          Get-Content ver.txt, err.txt
          if ($p.ExitCode -ne 0) { throw "--version failed: $($p.ExitCode)" }
          $p = Start-Process $exe -ArgumentList "analyze","smoke.mp4","--json","smoke.json","-q" -Wait -PassThru -NoNewWindow -RedirectStandardError err2.txt
          Get-Content err2.txt
          if ($p.ExitCode -ne 0) { throw "analyze failed: $($p.ExitCode)" }
          Get-Content smoke.json
          if (Select-String -Path err2.txt -Pattern "WARN|error" -Quiet) { throw "errors while analysing" }
          $env:BF6KT_GUI_SMOKE = "1"; $env:BF6KT_NO_UPDATE_CHECK = "1"
          $p = Start-Process $exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI failed to start: $($p.ExitCode)" }
          "GUI opened and closed OK"
      - run: Compress-Archive -Path dist/BF6KillTracker -DestinationPath BF6KillTracker-windows.zip
        shell: pwsh
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = python -c "import bf6killtracker; print(bf6killtracker.__version__)"
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist\BF6KillTracker-setup.exe | Format-List Name, Length
      - name: Smoke test the installer (silent install, run, uninstall)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process dist\BF6KillTracker-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$env:RUNNER_TEMP\bf6kt-inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          Start-Sleep 3
          Get-Process BF6KillTracker -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = "$env:RUNNER_TEMP\bf6kt-inst\BF6KillTracker.exe"
          $p = Start-Process $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput iv.txt
          Get-Content iv.txt
          if ($p.ExitCode -ne 0) { throw "installed exe failed" }
          $p = Start-Process "$env:RUNNER_TEMP\bf6kt-inst\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed" }
          "installer OK"
      - uses: actions/upload-artifact@v4
        with:
          name: BF6KillTracker-windows
          path: |
            BF6KillTracker-windows.zip
            dist/BF6KillTracker-setup.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BF6KillTracker-windows.zip
            dist/BF6KillTracker-setup.exe
          generate_release_notes: true
